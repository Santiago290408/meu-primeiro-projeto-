<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #1e1e24; /* Um fundo cinza escuro moderno */
            color: #ffffff;            /* Texto branco */
            font-family: Arial, sans-serif; 
            text-align: center;        
            padding-top: 80px;        
        }
        p {
            font-size: 20px;           /* Tamanho do texto menor */
            color: #bdc3c7;            /* Texto cinza claro */
        }
        button {
            background-color: #2ecc71; /* Cor verde do botão */
            color: white;              /* Texto branco dentro do botão */
            padding: 15px 32px;        /* Tamanho do botão */
            font-size: 16px;           /* Tamanho da letra do botão */
            border: none;              /* Remove bordas feias */
            border-radius: 8px;        /* Deixa os cantos arredondados */
            cursor: pointer;           /* Mostra a mãozinha ao passar o mouse */
        }
    </style>
</head>
<body>

    <h1>Meu primeiro site tem cor agora! 🎨</h1>
    
    <p>Estou dando os meus primeiros passos na programação e no GitHub.</p>
    
    <button onclick="alert('Parabéns por clicar! Você está programando!')">Clique em mim!</button>

</body>
</html>
